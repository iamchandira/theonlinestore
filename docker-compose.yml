# Local development services for The Online Store
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: theonlinestore
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # Local mail catcher: every email the app sends lands here (web inbox http://localhost:8026, SMTP :1026; elift-crm uses 8025/1025)
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - '8026:8025'
      - '1026:1025'

volumes:
  pgdata:
